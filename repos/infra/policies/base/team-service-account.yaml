apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: team-service-account
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [kustomizations]
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  validations:
    - expression: "has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'flux'"
      message: "Flux objects in a team namespace should set spec.serviceAccountName: flux, otherwise they reconcile as the powerless `default` ServiceAccount"
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: team-service-account
spec:
  policyName: team-service-account
  validationActions: [Warn, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: platform.k8s-base/team
          operator: Exists
