---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: accessrequests.access.k8s-base.io
spec:
  group: access.k8s-base.io
  names:
    categories:
    - access
    kind: AccessRequest
    listKind: AccessRequestList
    plural: accessrequests
    shortNames:
    - ar
    - areq
    singular: accessrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.targetNamespace
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.approvedBy
      name: ApprovedBy
      type: string
    - jsonPath: .status.expiresAt
      name: ExpiresAt
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              duration:
                description: |-
                  Duration is a Go duration string such as 30m or 2h. The per-role cap is
                  enforced by admission at request time and clamped again by the warden.
                pattern: ^([0-9]+(s|m|h))+$
                type: string
              reason:
                maxLength: 512
                minLength: 10
                type: string
              requester:
                description: |-
                  Requester is the OIDC username the grant is issued to. The
                  access-request-create admission policy pins it to the creating user.
                minLength: 1
                type: string
              role:
                description: |-
                  Role is the privilege tier a request asks for. Each value maps to exactly one
                  ClusterRole the warden is allowed to bind (see RoleCatalog).
                enum:
                - debug
                - team-admin
                - cluster-admin
                type: string
              targetNamespace:
                description: |-
                  TargetNamespace is where the RoleBinding lands. Ignored for
                  role cluster-admin, whose grant is cluster-scoped.
                maxLength: 63
                minLength: 1
                type: string
            required:
            - duration
            - reason
            - requester
            - role
            - targetNamespace
            type: object
          status:
            properties:
              approvedBy:
                description: |-
                  ApprovedBy is the OIDC username of the approver. The
                  access-request-approve admission policy pins it to the patching user and
                  forbids self-approval.
                type: string
              bindingRef:
                description: |-
                  BindingRef is the name of the RoleBinding or ClusterRoleBinding the
                  warden created; it is the only handle the sweep needs.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                format: date-time
                type: string
              phase:
                description: |-
                  Phase is the request's position in the state machine
                  Pending -> Approved -> Active -> Expired | Denied | Revoked.
                enum:
                - Pending
                - Approved
                - Active
                - Expired
                - Denied
                - Revoked
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
