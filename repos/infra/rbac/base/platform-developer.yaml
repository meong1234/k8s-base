---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-developer
  labels:
    platform.k8s-base/tier: developer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    - matchLabels:
        platform.k8s-base/aggregate-to-platform-developer: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-developer-rules
  labels:
    platform.k8s-base/aggregate-to-platform-developer: "true"
    platform.k8s-base/aggregate-to-platform-team-admin: "true"
    platform.k8s-base/aggregate-to-platform-operator: "true"
rules:
  - apiGroups: [""]
    resources: [pods/log, pods/status]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - fluxcd.controlplane.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [patch]
  - apiGroups:
      - networking.istio.io
      - security.istio.io
      - telemetry.istio.io
      - extensions.istio.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups:
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [access.k8s-base.io]
    resources: [accessrequests]
    verbs: [get, list, watch, create]
