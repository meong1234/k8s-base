---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-operator
  labels:
    platform.k8s-base/tier: operator
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    - matchLabels:
        platform.k8s-base/aggregate-to-platform-operator: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-operator-rules
  labels:
    platform.k8s-base/aggregate-to-platform-operator: "true"
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes, componentstatuses]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io, apiextensions.k8s.io, apiregistration.k8s.io, admissionregistration.k8s.io, policy, node.k8s.io, scheduling.k8s.io, coordination.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - fluxcd.controlplane.io
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [access.k8s-base.io]
    resources: [accessrequests]
    verbs: [get, list, watch, create]
  - apiGroups: [access.k8s-base.io]
    resources: [accessrequests/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-operator
subjects:
  - kind: Group
    name: platform:operator
    apiGroup: rbac.authorization.k8s.io
