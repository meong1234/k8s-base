---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-debug
  labels:
    platform.k8s-base/tier: debug
    platform.k8s-base/standing-binding: forbidden
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec, pods/attach, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/ephemeralcontainers]
    verbs: [get, create, update, patch]
