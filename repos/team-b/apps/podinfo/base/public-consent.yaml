---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-public-api
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: public-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: partner-api
  to:
    - group: ""
      kind: Service
      name: podinfo
