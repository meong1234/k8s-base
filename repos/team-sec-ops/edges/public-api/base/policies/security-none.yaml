---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: public-edge-none
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        platform.k8s-base/public-route: "true"
        platform.k8s-base/auth: none
  cors:
    allowOrigins:
      - "https://*.${CLUSTER_DOMAIN}"
    allowMethods:
      - GET
      - HEAD
      - OPTIONS
    allowHeaders:
      - authorization
      - content-type
    exposeHeaders:
      - x-ratelimit-limit
      - x-ratelimit-remaining
      - x-ratelimit-reset
    maxAge: 24h
    allowCredentials: false
