---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: public-edge-jwt
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        platform.k8s-base/public-route: "true"
        platform.k8s-base/auth: jwt
  cors:
    allowOrigins:
      - "https://*.${CLUSTER_DOMAIN}"
    allowMethods:
      - GET
      - HEAD
      - OPTIONS
    allowHeaders:
      - authorization
      - content-type
    exposeHeaders:
      - x-ratelimit-limit
      - x-ratelimit-remaining
      - x-ratelimit-reset
    maxAge: 24h
    allowCredentials: false
  jwt:
    providers:
      - name: dex
        # issuer and uri are the browser-facing strings the token carries and
        # resolve only on the laptop; backendRefs is the in-cluster path the
        # proxy actually fetches the keys over, plaintext on 5556.
        issuer: https://dex.${CLUSTER_DOMAIN}:${PUBLIC_PORT}
        audiences:
          - public-api
        remoteJWKS:
          uri: https://dex.${CLUSTER_DOMAIN}:${PUBLIC_PORT}/keys
          backendRefs:
            - group: ""
              kind: Service
              name: dex
              namespace: platform-identity
              port: 5556
        claimToHeaders:
          - claim: email
            header: x-user-email
          - claim: groups
            header: x-user-groups
