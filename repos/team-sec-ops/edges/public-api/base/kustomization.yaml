apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer here: the routes live in public-api but the edge
# policies attach to the public Gateway and must sit in platform-ingress, and
# kustomize would rewrite that. Every object names its namespace itself.
labels:
  - includeSelectors: false
    pairs:
      platform.k8s-base/public-route: "true"
resources:
  - routes/https-redirect.yaml
  - routes/team-a-podinfo.yaml
  - routes/team-a-catalog.yaml
  - routes/team-b-orders.yaml
  - routes/platform-dex.yaml
  - edge-policies/request-authentication.yaml
  - edge-policies/authorization-require-jwt.yaml
  - edge-policies/ratelimit.yaml
