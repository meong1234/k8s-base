---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-dex
  labels:
    platform.k8s-base/owner-team: platform
    platform.k8s-base/auth: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform-ingress
      sectionName: https
  hostnames:
    - dex.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: dex
          namespace: platform-identity
          port: 5556
