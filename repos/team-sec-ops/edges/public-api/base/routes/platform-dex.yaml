---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-dex
  namespace: public-api
  labels:
    platform.k8s-base/owner-team: platform
    platform.k8s-base/auth: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform-ingress
      sectionName: https
  hostnames:
    - dex.${CLUSTER_DOMAIN}
  rules:
    - filters:
        - type: CORS
          cors:
            allowOrigins:
              - "https://*.${CLUSTER_DOMAIN}"
            allowMethods: [GET, HEAD, OPTIONS]
            allowHeaders: [authorization, content-type]
            exposeHeaders:
              - x-ratelimit-limit
              - x-ratelimit-remaining
              - x-ratelimit-reset
            maxAge: 86400
            allowCredentials: false
      backendRefs:
        - group: ""
          kind: Service
          name: dex
          namespace: platform-identity
          port: 5556
