---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: public-api
  labels:
    platform.k8s-base/owner-team: platform
    platform.k8s-base/auth: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform-ingress
      sectionName: http
  hostnames:
    - "*.${CLUSTER_DOMAIN}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            # The redirect has to name the port the browser dialled, not the
            # listener's: on k3d the host maps 8443 -> loadbalancer 443.
            port: ${PUBLIC_PORT}
            statusCode: 301
