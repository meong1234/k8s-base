apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer: routes and key Secrets live in partner-api, the
# per-partner rate limits attach to the partner Gateway in platform-ingress, and
# kustomize would rewrite that. Every object names its namespace itself.
labels:
  - includeSelectors: false
    pairs:
      platform.k8s-base/partner-route: "true"
resources:
  - ../../base/partners/partner-a
  - ../../base/partners/partner-b
  - partner-a-keys.enc.yaml
  - partner-b-keys.enc.yaml
