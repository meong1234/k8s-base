---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partner-b
  labels:
    platform.k8s-base/owner-team: team-b
    platform.k8s-base/auth: api-key
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: partner
      namespace: platform-ingress
      sectionName: https
  hostnames:
    - partner-b.partners.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          namespace: team-b-apps
          port: 9898
