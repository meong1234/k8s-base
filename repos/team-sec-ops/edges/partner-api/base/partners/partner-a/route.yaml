---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partner-a
  namespace: partner-api
  labels:
    platform.k8s-base/owner-team: team-b
    platform.k8s-base/auth: api-key
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: partner
      namespace: platform-ingress
      sectionName: https
  hostnames:
    - partner-a.partners.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            # The credential stops at the edge. edge-authz has already read it
            # (ext_authz runs before the router); the backend authorizes on
            # x-partner-id, which edge-authz sets and Envoy overwrites.
            remove: [x-api-key]
      backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          namespace: team-b-apps
          port: 9898
