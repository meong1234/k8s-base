---
# The contractual limit for this partner, 100 requests per minute per client
# address. Attached to the partner Gateway, so it lives in platform-ingress;
# scoped to this partner by the virtual host istiod names "<hostname>:<listener
# port>". A typo there limits nothing and errors nowhere: check with
# istioctl proxy-config route deploy/partner-istio -n platform-ingress.
# Local means per gateway replica; a global limit needs a rate limit service.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: partner-a-ratelimit
  namespace: platform-ingress
  labels:
    platform.k8s-base/owner-team: team-b
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: partner
  priority: 10
  configPatches:
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          portNumber: 9443
          vhost:
            name: "partner-a.partners.${CLUSTER_DOMAIN}:9443"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.local_ratelimit:
              "@type": type.googleapis.com/udpa.type.v1.TypedStruct
              type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              value:
                stat_prefix: partner_a_local_rl
                token_bucket:
                  max_tokens: 100
                  tokens_per_fill: 100
                  fill_interval: 60s
                always_consume_default_token_bucket: false
                filter_enabled:
                  runtime_key: partner_a_local_rl_enabled
                  default_value: { numerator: 100, denominator: HUNDRED }
                filter_enforced:
                  runtime_key: partner_a_local_rl_enforced
                  default_value: { numerator: 100, denominator: HUNDRED }
                enable_x_ratelimit_headers: DRAFT_VERSION_03
                local_rate_limit_per_downstream_connection: false
                rate_limits:
                  - actions:
                      - remote_address: {}
                descriptors:
                  - entries:
                      - key: remote_address
                    token_bucket:
                      max_tokens: 100
                      tokens_per_fill: 100
                      fill_interval: 60s
                max_dynamic_descriptors: 1000
