apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
spec:
  interval: 10m
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: podinfo-chart
  values:
    # The reviewed default a new environment inherits until its overlay says
    # otherwise. Pinned, and pinned *here* rather than read from cluster-vars: a
    # post-build variable would hide which version runs where, and which version
    # runs where is the thing a promotion PR exists to show.
    image:
      tag: 6.16.0
    replicaCount: 1
    service:
      additionalLabels:
        istio.io/use-waypoint: waypoint
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
