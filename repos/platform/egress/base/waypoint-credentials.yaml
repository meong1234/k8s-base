apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-waypoint-credentials
  namespace: platform-egress
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-waypoint-credentials
  namespace: platform-egress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-waypoint-credentials
subjects:
  - kind: ServiceAccount
    name: egress-waypoint
    namespace: platform-egress
