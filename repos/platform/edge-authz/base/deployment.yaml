---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-authz
  namespace: platform-ingress
  labels:
    app.kubernetes.io/name: edge-authz
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-authz
        app.kubernetes.io/part-of: platform
        # Enrolled per pod: the partner gateway reaches this over HBONE with its
        # own identity. The namespace itself stays out of ambient, because its
        # gateway pods must not be captured.
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: edge-authz
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge-authz
          image: docker.io/k8s-base/edge-authz:dev
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8080
            - --probe-listen=:8081
            - --secrets-namespace=partner-api
            - --secret-suffix=-keys
            - --key-header=x-api-key
            - --partner-id-header=x-partner-id
          ports:
            - name: http
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edge-authz
  namespace: platform-ingress
  labels:
    app.kubernetes.io/name: edge-authz
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app.kubernetes.io/name: edge-authz
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
