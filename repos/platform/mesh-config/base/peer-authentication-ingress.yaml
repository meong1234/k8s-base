---
# The LoadBalancer datapath is outside the mesh: k3s' servicelb (klipper-lb) is a
# host-network pod that forwards raw TCP to the Envoy proxies, and mesh-wide
# STRICT refuses it, so the public Gateway answers nothing through the k3d port
# mapping. The proxies stay ambient-enrolled — PERMISSIVE is inbound only, so the
# hop from a proxy to a team pod is still HBONE and the team's baseline
# AuthorizationPolicy still sees envoy-gateway-system as the source.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: ingress-gateways
  namespace: envoy-gateway-system
spec:
  mtls:
    mode: PERMISSIVE
