---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: platform-ingress
  labels:
    app.kubernetes.io/part-of: platform
    platform.k8s-base/gateway-scope: internal
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  listeners:
    - name: internal-https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: internal-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-ingress, public-api, platform-identity]
