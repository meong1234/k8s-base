---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: platform-ingress
  labels:
    app.kubernetes.io/part-of: platform
    platform.k8s-base/gateway-scope: internal
  annotations:
    # Only the public and partner doors need a klipper-lb address. istiod reads
    # this on the Gateway and renders a ClusterIP Service; the demo reaches it
    # with a port-forward on 8444.
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: internal-https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: internal-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-ingress, public-api, platform-identity]
