---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: partner
  namespace: platform-ingress
  labels:
    app.kubernetes.io/part-of: platform
    platform.k8s-base/gateway-scope: partner
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: partner
  listeners:
    - name: https
      protocol: HTTPS
      port: 9443
      hostname: "*.partners.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: partners-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.k8s-base/role: partner-edge
