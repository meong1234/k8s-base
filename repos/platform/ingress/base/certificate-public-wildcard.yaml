---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-wildcard
  namespace: platform-ingress
  labels:
    app.kubernetes.io/part-of: platform
spec:
  secretName: public-wildcard-tls
  duration: 2160h
  renewBefore: 360h
  commonName: "*.${CLUSTER_DOMAIN}"
  dnsNames:
    - "*.${CLUSTER_DOMAIN}"
    - ${CLUSTER_DOMAIN}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  issuerRef:
    name: ${CERT_ISSUER}
    kind: ClusterIssuer
    group: cert-manager.io
