---
# istiod serves each Gateway's TLS Secret to its proxy over SDS and gates the
# read with a SubjectAccessReview against the proxy's own ServiceAccount. The
# generated ServiceAccount is named after the Gateway and its class. Without
# this binding the certificate sits in WARMING with no error on any Istio
# object, and a denial is cached until the proxy restarts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-gateway-credentials
  namespace: platform-ingress
  labels:
    app.kubernetes.io/part-of: platform
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-gateway-credentials
  namespace: platform-ingress
  labels:
    app.kubernetes.io/part-of: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-gateway-credentials
subjects:
  - kind: ServiceAccount
    name: public-istio
    namespace: platform-ingress
  - kind: ServiceAccount
    name: internal-istio
    namespace: platform-ingress
  - kind: ServiceAccount
    name: partner-istio
    namespace: platform-ingress
