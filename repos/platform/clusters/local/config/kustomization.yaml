apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Second stage: every custom resource whose CRD is installed by a chart in the
# first stage. kustomize-controller dry-runs a whole revision before applying
# any of it, so these cannot share a Kustomization with their own CRDs.
resources:
  - ../../../mesh-config/envs/local
  - ../../../proxies/envs/local
