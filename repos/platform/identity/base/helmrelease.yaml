---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: platform-identity
  releaseName: dex
  serviceAccountName: kustomize-controller
  maxHistory: 2
  chart:
    spec:
      chart: dex
      version: 0.26.0
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      tag: v2.46.1

    replicaCount: 1

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

    podSecurityContext:
      runAsNonRoot: true
      # The image declares USER dex, and a kubelet cannot verify a non-numeric
      # user against runAsNonRoot; 1001 is what that name resolves to.
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: [ALL]

    # The entrypoint expands secretEnv into a temp copy of the config, which
    # readOnlyRootFilesystem would otherwise refuse.
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp

    envVars:
      - name: KUBE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: dex-client
            key: client-secret
      - name: PUBLIC_API_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: dex-client
            key: public-api-client-secret

    config:
      issuer: https://dex.${CLUSTER_DOMAIN}:${PUBLIC_PORT}
      storage:
        type: kubernetes
        config:
          inCluster: true
      web:
        http: 0.0.0.0:5556
      logger:
        level: info
        format: json
      oauth2:
        skipApprovalScreen: true
        responseTypes: [code]
        grantTypes:
          - authorization_code
          - refresh_token
          - password
      expiry:
        idTokens: 10m
        refreshTokens:
          validIfNotUsedFor: 24h
      staticClients:
        - id: kubernetes
          name: Kubernetes (kubelogin and internal UIs)
          secretEnv: KUBE_CLIENT_SECRET
          redirectURIs:
            - http://localhost:8000
            - http://localhost:18000
            - https://hubble.internal.${CLUSTER_DOMAIN}:${INTERNAL_PORT}/oauth2/callback
        - id: public-api
          name: Company APIs
          secretEnv: PUBLIC_API_CLIENT_SECRET
          # The password grant never redirects, and a public client would let
          # anyone mint an API token without the secret.
          public: false
          redirectURIs: []
