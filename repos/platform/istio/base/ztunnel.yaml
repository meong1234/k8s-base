---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: flux-system
spec:
  dependsOn:
    - name: istio-cni
  interval: 10m
  targetNamespace: istio-system
  releaseName: ztunnel
  serviceAccountName: kustomize-controller
  maxHistory: 2
  chart:
    spec:
      chart: ztunnel
      version: 1.31.3
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    profile: ambient
    # The chart asks for 200m / 512Mi per node, three times over.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
