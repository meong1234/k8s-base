---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: flux-system
spec:
  dependsOn:
    - name: istiod
  interval: 10m
  targetNamespace: istio-system
  releaseName: istio-cni
  serviceAccountName: kustomize-controller
  maxHistory: 2
  chart:
    spec:
      chart: cni
      version: 1.31.3
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    profile: ambient
    cni:
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
