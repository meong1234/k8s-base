---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-ks
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-ks
    - name: infra-config-ks
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./clusters/${CLUSTER_ENV}
  prune: true
  wait: true
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: ${SOURCE_KIND:=OCIRepository}
    name: platform-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# Everything that is itself a custom resource of a CRD installed by a chart in
# platform-ks has to be a second Kustomization: kustomize-controller
# server-side dry-runs a whole set before applying any of it, so one unknown
# kind holds back the very HelmRelease that would register it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-config-ks
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-ks
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/${CLUSTER_ENV}/config
  prune: true
  wait: true
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: ${SOURCE_KIND:=OCIRepository}
    name: platform-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
