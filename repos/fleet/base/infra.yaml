---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-ks
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/${CLUSTER_ENV}
  prune: true
  wait: true
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: ${SOURCE_KIND:=OCIRepository}
    name: infra-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
