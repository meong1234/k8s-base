apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jwt-route-on-partner
  namespace: partner-api
  labels:
    platform.k8s-base/owner-team: team-b
    platform.k8s-base/auth: jwt
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: partner
      namespace: platform-ingress
      sectionName: https
  hostnames:
    - partner-c.partners.__DOMAIN__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/orders
      backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          namespace: team-b-apps
          port: 9898
