apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-a-reaches-flux
  namespace: public-api
  labels:
    platform.k8s-base/owner-team: platform
    platform.k8s-base/auth: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform-ingress
      sectionName: https
  hostnames:
    - api.__DOMAIN__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /flux
      backendRefs:
        - group: ""
          kind: Service
          name: notification-controller
          namespace: flux-system
          port: 80
