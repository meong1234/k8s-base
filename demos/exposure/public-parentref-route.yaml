apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-public-shortcut
  namespace: team-a-apps
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform-ingress
  hostnames:
    - api.__DOMAIN__
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          port: 9898
