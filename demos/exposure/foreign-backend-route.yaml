apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-a-steals-team-b
  namespace: public-api
  labels:
    platform.k8s-base/owner-team: team-a
    platform.k8s-base/auth: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform-ingress
      sectionName: https
  hostnames:
    - api.__DOMAIN__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /podinfo
      backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          namespace: team-b-apps
          port: 9898
