apiVersion: v1
kind: Pod
metadata:
  name: bad-registry
  namespace: team-a-apps
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: x
      image: evil.example.com/x:1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
