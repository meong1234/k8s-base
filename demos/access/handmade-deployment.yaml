apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift
  namespace: team-a-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drift
  template:
    metadata:
      labels:
        app: drift
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: docker.io/library/busybox:1.37
          command: [sleep, "3600"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
