apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: __NAME__
  namespace: __TEAM__
  labels:
    sharding.fluxcd.io/key: __SHARD__
spec:
  interval: 1m
  provider: generic
  insecure: true
  url: oci://__REGISTRY__/__NAME__
  ref:
    tag: demo
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: __NAME__
  namespace: __TEAM__
  labels:
    sharding.fluxcd.io/key: __SHARD__
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 1m
  prune: true
  wait: false
  serviceAccountName: flux
  sourceRef:
    kind: OCIRepository
    name: __NAME__
  path: ./
