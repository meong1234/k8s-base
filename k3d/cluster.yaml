apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: local-dev
servers: 1
agents: 2
image: rancher/k3s:v1.35.5-k3s1
subnet: 172.28.0.0/16
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  - port: 9443:9443
    nodeFilters:
      - loadbalancer
files:
  - source: admission.yaml
    destination: /etc/rancher/k3s/admission.yaml
    nodeFilters:
      - server:*
  - source: ../.keys/local/platform/authn.yaml
    destination: /etc/rancher/k3s/authn.yaml
    nodeFilters:
      - server:*
  - source: audit-policy.yaml
    destination: /etc/rancher/k3s/audit-policy.yaml
    nodeFilters:
      - server:*
  - source: cilium-helmchart.yaml
    destination: k3s-manifests-custom/cilium.yaml
    nodeFilters:
      - server:*
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik,network-policy
        nodeFilters:
          - server:*
      - arg: --flannel-backend=none
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=admission-control-config-file=/etc/rancher/k3s/admission.yaml
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=authentication-config=/etc/rancher/k3s/authn.yaml
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-log-path=/var/log/kubernetes/audit.log
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-log-maxage=7
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-log-maxbackup=2
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-log-maxsize=50
        nodeFilters:
          - server:*
registries:
  use:
    - k3d-local-dev-registry:5000
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - "http://k3d-local-dev-registry:5000"
      "ghcr.io":
        endpoint:
          - "http://k3d-local-dev-registry:5000"
      "quay.io":
        endpoint:
          - "http://k3d-local-dev-registry:5000"
