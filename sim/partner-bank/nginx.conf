log_format partner '$remote_addr "$request" $status client="$ssl_client_s_dn" verify=$ssl_client_verify';

server {
    listen 443 ssl;
    server_name api.partner-bank.test;

    access_log /dev/stdout partner;
    error_log  /dev/stderr warn;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /transfers {
        if ($request_method != POST) { return 405; }
        default_type application/json;
        return 200 '{"status":"accepted","client":"$ssl_client_s_dn"}';
    }

    location / { return 404; }
}
